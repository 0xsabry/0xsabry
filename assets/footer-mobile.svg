<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240"
     viewBox="0 0 600 240" role="img" aria-labelledby="ft-title ft-desc">
  <title id="ft-title">End of transmission</title>
  <desc id="ft-desc">Closing frame: NIGHTWATCH signature for Mohamed Sabry.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080e"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#9db2c6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="598" height="238" rx="14"/></clipPath>
    <g id="crop"><path d="M0 16 L0 0 L16 0" fill="none" stroke="#2b4659" stroke-width="1.4"/></g>
  </defs>

  <style>
    text { font-family: ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; white-space: pre; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .kicker { font-size: 9px; fill: #4f677d; letter-spacing: 3px; }
    .title  { font-size: 22px; font-weight: 300; letter-spacing: 6px; fill: url(#ink); }
    .sub    { font-size: 9.5px; fill: #7c8ea3; letter-spacing: 2.4px; }
    .sig    { font-size: 10px; fill: #5f93a8; letter-spacing: 2px; }
    .micro  { font-size: 8px; fill: #3d566b; letter-spacing: 1.8px; }
  </style>

  <rect width="600" height="240" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect width="600" height="240" fill="url(#glow)"/>

    <g transform="translate(14 14)"><use href="#crop"/></g>
    <g transform="translate(586 14) rotate(90)"><use href="#crop"/></g>
    <g transform="translate(586 226) rotate(180)"><use href="#crop"/></g>
    <g transform="translate(14 226) rotate(270)"><use href="#crop"/></g>

    <text class="kicker" x="300" y="62" text-anchor="middle">NIGHTWATCH //</text>
    <text class="kicker" x="300" y="80" text-anchor="middle">CYBER INTELLIGENCE</text>

    <text class="sans title" x="300" y="124" text-anchor="middle" textLength="468" lengthAdjust="spacingAndGlyphs">END OF TRANSMISSION</text>

    <rect x="140" y="138" width="320" height="1" fill="url(#hair)"/>

    <text class="sub" x="300" y="162" text-anchor="middle">SOC · DFIR · DETECTION</text>
    <text class="sub" x="300" y="178" text-anchor="middle">ENGINEERING</text>

    <text class="sig" x="300" y="204" text-anchor="middle">— MOHAMED SABRY · 0XSABRY</text>

    <line x1="1" y1="212" x2="599" y2="212" stroke="#16283a"/>
    <text class="micro" x="26" y="228">PROFILE SCHEMATIC · DECORATIVE</text>
    <text class="micro" x="574" y="228" text-anchor="end" fill="#42627a">0XSABRY.GITHUB.IO</text>
  </g>

  <rect x="1" y="1" width="598" height="238" rx="14" fill="none" stroke="#1a2b3a" stroke-width="1.4"/>
</svg>
