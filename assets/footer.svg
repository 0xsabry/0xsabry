<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200"
     viewBox="0 0 1200 200" role="img" aria-labelledby="ft-title ft-desc">
  <title id="ft-title">End of transmission</title>
  <desc id="ft-desc">Closing frame: NIGHTWATCH signature for Mohamed Sabry.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080e"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#9db2c6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="198" rx="14"/></clipPath>
    <g id="crop"><path d="M0 16 L0 0 L16 0" fill="none" stroke="#2b4659" stroke-width="1.4"/></g>
  </defs>

  <style>
    text { font-family: ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; white-space: pre; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .kicker { font-size: 9.5px; fill: #4f677d; letter-spacing: 4px; }
    .title  { font-size: 31px; font-weight: 300; letter-spacing: 10px; fill: url(#ink); }
    .sub    { font-size: 10.5px; fill: #7c8ea3; letter-spacing: 3.2px; }
    .sig    { font-size: 11px; fill: #5f93a8; letter-spacing: 2.4px; }
    .micro  { font-size: 8.5px; fill: #3d566b; letter-spacing: 2.2px; }
  </style>

  <rect width="1200" height="200" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="200" fill="url(#glow)"/>

    <g transform="translate(16 16)"><use href="#crop"/></g>
    <g transform="translate(1184 16) rotate(90)"><use href="#crop"/></g>
    <g transform="translate(1184 184) rotate(180)"><use href="#crop"/></g>
    <g transform="translate(16 184) rotate(270)"><use href="#crop"/></g>

    <text class="kicker" x="600" y="48" text-anchor="middle">NIGHTWATCH // CYBER INTELLIGENCE</text>

    <text class="sans title" x="600" y="94" text-anchor="middle" textLength="560" lengthAdjust="spacingAndGlyphs">END OF TRANSMISSION</text>

    <rect x="420" y="108" width="360" height="1" fill="url(#hair)"/>

    <text class="sub" x="600" y="134" text-anchor="middle">SOC · DFIR · DETECTION ENGINEERING</text>

    <text class="sig" x="600" y="158" text-anchor="middle">— MOHAMED SABRY · 0XSABRY</text>

    <line x1="1" y1="174" x2="1199" y2="174" stroke="#16283a"/>
    <text class="micro" x="40" y="190">PROFILE SCHEMATIC · DECORATIVE</text>
    <text class="micro" x="1160" y="190" text-anchor="end" fill="#42627a">0XSABRY.GITHUB.IO</text>
  </g>

  <rect x="1" y="1" width="1198" height="198" rx="14" fill="none" stroke="#1a2b3a" stroke-width="1.4"/>
</svg>
