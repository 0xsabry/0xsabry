<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140"
     viewBox="0 0 900 140" role="img" aria-label="Thanks for watching - end credits">
  <title>End Credits</title>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#ffe4bd"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="140" rx="12"/></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace,'SF Mono','JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace; white-space: pre; }
    .display { font-family: Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Bold',Arial,sans-serif; letter-spacing: 6px; }
    .kicker { font-size: 9px;   fill: #8b7355; letter-spacing: 3.6px; }
    .title  { font-size: 30px;  fill: url(#ink); }
    .say    { font-size: 11.5px; fill: #c9d1d9; letter-spacing: 2.6px; }
    .dim    { font-size: 9px;   fill: #6e7681; letter-spacing: 2.6px; }
    .rec    { fill: #ff3b30; }

    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: no-preference) {
      .blink { animation: blink 1.15s steps(1) infinite; }
    }
  </style>

  <rect width="900" height="140" rx="12" fill="#07070a"/>
  <g clip-path="url(#clip)">
    <rect width="900" height="140" fill="url(#glow)"/>
    <rect x="0.5" y="0.5" width="899" height="139" rx="12" fill="none" stroke="#2a2118"/>
    <rect x="0" y="0" width="6" height="140" fill="#ff3b30" fill-opacity="0.55"/>
    <rect x="894" y="0" width="6" height="140" fill="#ffb347" fill-opacity="0.55"/>
  </g>

  <text class="kicker" x="450" y="30" text-anchor="middle">DIRECTED, WRITTEN &amp; BUILT BY 0XSABRY</text>

  <text class="display title" x="450" y="64" text-anchor="middle"
        textLength="430" lengthAdjust="spacingAndGlyphs">THANKS FOR WATCHING</text>

  <rect x="215" y="76" width="470" height="1.4" fill="url(#rule)"/>

  <text class="say" x="450" y="99" text-anchor="middle">STAY VIGILANT. STAY SECURED.</text>

  <line x1="40" y1="112" x2="860" y2="112" stroke="#241c14" stroke-width="1" stroke-dasharray="2 4"/>

  <circle class="blink" cx="48" cy="127" r="3.4" fill="#ff3b30"/>
  <text class="dim" x="62" y="130">BUILT FOR BLUE TEAMS &#183; POWERED BY THREAT INTEL &#183; SECURED BY DESIGN</text>
  <text class="dim" x="858" y="130" text-anchor="end" fill="#c9a227">EOF // 0</text>
</svg>
