<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720"
     viewBox="0 0 600 720" role="img"
     aria-label="Mohamed Sabry Hamdan - SOC Analyst and DFIR Specialist">
  <title>Mohamed Sabry Hamdan - SOC Analyst and DFIR Specialist</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a10"/>
      <stop offset="0.55" stop-color="#07070b"/>
      <stop offset="1" stop-color="#040406"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="-0.1" r="1.0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#ff9f1a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="1.15" r="0.9">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#fff1dc"/>
      <stop offset="0.58" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#a35f00"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5c3a10"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffb347" opacity="0.045"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="card"><rect x="3" y="3" width="594" height="714" rx="16"/></clipPath>
    <g id="corner">
      <path d="M0 24 L0 0 L24 0" fill="none" stroke="#ffb347" stroke-width="2" stroke-opacity="0.55"/>
    </g>
  </defs>

  <style>
    text { font-family: ui-monospace,'SF Mono','JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace; white-space: pre; }
    .display { font-family: Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Bold',Arial,sans-serif; letter-spacing: 2px; }
    .cond    { font-family: Impact,Haettenschweiler,'Arial Narrow',Arial,sans-serif; }
    .hud   { font-size: 9.5px;   fill: #8b7355; letter-spacing: 1.4px; }
    .kick  { font-size: 11px;    fill: #ff9f1a; letter-spacing: 5px; }
    .title { font-size: 56px;    fill: url(#ink); }
    .role  { font-size: 12.5px;  fill: #e8ecf1; letter-spacing: 2.2px; }
    .tag   { font-size: 15.5px;  fill: #9aa4b2; font-style: italic;
             font-family: Georgia,'Times New Roman',serif; }
    .chip  { font-size: 13.5px;  fill: #ffb347; letter-spacing: 1.3px; }
    .chip2 { font-size: 8.5px;   fill: #8b949e; letter-spacing: 1.9px; }
    .bill  { font-size: 10.5px;  fill: #6e7681; letter-spacing: 0.3px; }
    .foot  { font-size: 9px;     fill: #8b7355; letter-spacing: 3.4px; }

    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @media (prefers-reduced-motion: no-preference) {
      .blink { animation: blink 1.15s steps(1) infinite; }
    }
  </style>

  <rect width="600" height="720" rx="18" fill="url(#bg)"/>

  <g clip-path="url(#card)">
    <rect x="3" y="3" width="594" height="714" fill="url(#spot)"/>
    <rect x="3" y="3" width="594" height="714" fill="url(#ember)"/>
    <rect x="3" y="3" width="594" height="714" fill="url(#scanlines)"/>
    <rect x="3" y="3" width="594" height="714" filter="url(#grain)" opacity="0.05"/>
    <rect x="3" y="3" width="594" height="714" fill="url(#vig)"/>

    <g transform="translate(14 50)"><use href="#corner"/></g>
    <g transform="translate(586 50) rotate(90)"><use href="#corner"/></g>
    <g transform="translate(586 706) rotate(180)"><use href="#corner"/></g>
    <g transform="translate(14 706) rotate(270)"><use href="#corner"/></g>

    <text class="kick" x="304" y="168" text-anchor="middle">A SECURITY</text>
    <text class="kick" x="304" y="192" text-anchor="middle">OPERATIONS PROFILE</text>

    <text class="display title" x="300" y="268" text-anchor="middle"
          textLength="500" lengthAdjust="spacingAndGlyphs">MOHAMED SABRY</text>
    <text class="display title" x="300" y="330" text-anchor="middle"
          textLength="360" lengthAdjust="spacingAndGlyphs">HAMDAN</text>

    <rect x="75" y="352" width="450" height="1.6" fill="url(#rule)"/>
    <g transform="translate(300 352.8)" fill="none" stroke="#ffb347" stroke-width="1.4">
      <rect x="-5.2" y="-5.2" width="10.4" height="10.4" rx="1.8" transform="rotate(45)" stroke-opacity="0.9"/>
      <circle r="2" fill="#ffb347" stroke="none"/>
    </g>

    <text class="role" x="301" y="390" text-anchor="middle">SOC ANALYST // DFIR SPECIALIST</text>
    <text class="role" x="301" y="412" text-anchor="middle">// DETECTION ENGINEER</text>

    <text class="tag" x="300" y="452" text-anchor="middle">The breach always leaves a trace.</text>
    <text class="tag" x="300" y="476" text-anchor="middle">He reads it.</text>

    <g>
      <rect x="55" y="510" width="490" height="46" rx="4" fill="#2b1c08" fill-opacity="0.6"
            stroke="#ffb347" stroke-opacity="0.32"/>
      <text class="chip"  x="300" y="531" text-anchor="middle">115+ DETECTION RULES</text>
      <text class="chip2" x="300" y="547" text-anchor="middle">THREATSCOPEX ENGINE</text>

      <rect x="55" y="564" width="490" height="46" rx="4" fill="#2b1c08" fill-opacity="0.6"
            stroke="#ffb347" stroke-opacity="0.32"/>
      <text class="chip"  x="300" y="585" text-anchor="middle">97 MITRE TECHNIQUES</text>
      <text class="chip2" x="300" y="601" text-anchor="middle">MAPPED &amp; COVERED</text>

      <rect x="55" y="618" width="490" height="46" rx="4" fill="#2b1c08" fill-opacity="0.6"
            stroke="#ffb347" stroke-opacity="0.32"/>
      <text class="chip"  x="300" y="639" text-anchor="middle">10+ CERTIFICATIONS</text>
      <text class="chip2" x="300" y="655" text-anchor="middle">SOC / DFIR TRACKS</text>
    </g>

    <text class="cond bill" x="300" y="688" text-anchor="middle"
          textLength="540" lengthAdjust="spacingAndGlyphs">THREAT HUNTING &#183; SIEM OPS &#183; DFIR &#183; DETECTION ENGINEERING</text>

    <text class="foot" x="300" y="706" text-anchor="middle">SOC OPERATIONS / DFIR / SECURITY ENGINEERING</text>
  </g>

  <rect x="3" y="3" width="594" height="33" rx="16" fill="#000000" fill-opacity="0.72"/>
  <rect x="3" y="20" width="594" height="16" fill="#000000" fill-opacity="0.72"/>
  <line x1="3" y1="36" x2="597" y2="36" stroke="#ffb347" stroke-opacity="0.28"/>

  <circle class="blink" cx="24" cy="19.5" r="4.4" fill="#ff3b30"/>
  <text class="hud" x="35" y="23">REC</text>
  <text class="hud" x="576" y="23" text-anchor="end" fill="#c9a227">TC 00:42:07:19</text>

  <rect x="3" y="3" width="594" height="714" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" opacity="0.9"/>
</svg>
