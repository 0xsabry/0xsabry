<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620"
     viewBox="0 0 720 620" role="img" aria-labelledby="nw-title nw-desc">
  <title id="nw-title">NIGHTWATCH — Mohamed Sabry</title>
  <desc id="nw-desc">Decorative cyber-intelligence banner. Mohamed Sabry — cybersecurity, detection engineering and DFIR — with a small signal strip. The graphic is decorative, not live telemetry.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080e"/>
      <stop offset="0.55" stop-color="#070c14"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="-0.1" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#0e7490" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.82">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#9db2c6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#1b2f40" stroke-width="0.7" opacity="0.5"/>
    </pattern>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="718" height="618" rx="14"/></clipPath>
    <g id="crop"><path d="M0 16 L0 0 L16 0" fill="none" stroke="#2b4659" stroke-width="1.4"/></g>
  </defs>

  <style>
    text { font-family: ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; white-space: pre; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .eyebrow { font-size: 10.5px; fill: #22d3ee; letter-spacing: 3.4px; }
    .name    { font-size: 58px; font-weight: 300; letter-spacing: 6px; fill: url(#ink); }
    .handle  { font-size: 10.5px; fill: #5f93a8; letter-spacing: 2.2px; }
    .ident   { font-size: 11.5px; fill: #9fb3c8; letter-spacing: 2.4px; }
    .mission { font-size: 14.5px; fill: #b9c9d9; }
    .meta-k  { font-size: 8.5px; fill: #4f677d; letter-spacing: 2.4px; }
    .meta-v  { font-size: 11.5px; fill: #d7e3ee; letter-spacing: 1px; }
    .bar     { font-size: 8.5px; fill: #4f677d; letter-spacing: 2.4px; }
    .dial    { font-size: 8px; fill: #4c657a; letter-spacing: 2.6px; }

    @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) {
      .contact { animation: breathe 4.2s ease-in-out infinite; }
    }
  </style>

  <rect width="720" height="620" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect width="720" height="620" fill="url(#grid)"/>
    <rect width="720" height="620" fill="url(#glow)"/>
    <rect width="720" height="620" fill="url(#vig)"/>
    <rect width="720" height="620" filter="url(#noise)" opacity="0.035"/>

    <g transform="translate(16 16)"><use href="#crop"/></g>
    <g transform="translate(704 16) rotate(90)"><use href="#crop"/></g>
    <g transform="translate(704 604) rotate(180)"><use href="#crop"/></g>
    <g transform="translate(16 604) rotate(270)"><use href="#crop"/></g>

    <circle cx="51.5" cy="54" r="3" fill="#34d399"/>
    <text class="eyebrow" x="64" y="58">NIGHTWATCH // CYBER INTELLIGENCE</text>
    <rect x="48" y="72" width="624" height="1" fill="url(#hair)"/>

    <text class="sans name" x="46" y="150">MOHAMED</text>
    <text class="sans name" x="46" y="214">SABRY</text>

    <text class="handle" x="48" y="242">0XSABRY</text>
    <text class="handle" x="124" y="242" fill="#33566b">//</text>
    <text class="handle" x="150" y="242" fill="#547387">BLUE TEAM · SECURITY ENGINEERING</text>

    <text class="ident" x="48" y="288">CYBERSECURITY · DETECTION ENGINEERING</text>
    <text class="ident" x="48" y="310">· DFIR</text>

    <text class="sans mission" x="48" y="356">I build detection systems that turn raw</text>
    <text class="sans mission" x="48" y="380">telemetry into evidence — and evidence</text>
    <text class="sans mission" x="48" y="404">into decisions.</text>

    <text class="meta-k" x="48" y="456">FOCUS</text>
    <text class="meta-v" x="150" y="456">BLUE TEAM / SOC</text>
    <text class="meta-k" x="48" y="484">STACK</text>
    <text class="meta-v" x="150" y="484">PYTHON · WAZUH · SIGMA</text>
    <text class="meta-k" x="48" y="512">BASE</text>
    <text class="meta-v" x="150" y="512">CAIRO, EG</text>

    <g class="contact">
      <circle cx="660" cy="500" r="7" fill="none" stroke="#34d399" stroke-opacity="0.35"/>
      <circle cx="660" cy="500" r="2.8" fill="#34d399"/>
    </g>

    <path d="M48 552 H672" stroke="#16283a" stroke-width="1"/>
    <polyline points="48,552 92,552 98,546 104,558 112,548 120,552 180,552 188,544 194,560 202,550 210,552 300,552 308,547 314,557 322,552 420,552 428,545 434,559 442,552 520,552 528,548 534,556 542,552 672,552"
              fill="none" stroke="#2f586e" stroke-width="1.2" stroke-linejoin="round"/>
    <polyline points="420,552 428,545 434,559 442,552" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round" opacity="0.9"/>
    <text class="dial" x="48" y="576">TELEMETRY SCHEMATIC</text>

    <line x1="1" y1="592" x2="719" y2="592" stroke="#16283a"/>
    <text class="bar" x="48" y="607">SOC · DFIR · DETECTION ENGINEERING · THREAT HUNTING</text>
  </g>

  <rect x="1" y="1" width="718" height="618" rx="14" fill="none" stroke="#1a2b3a" stroke-width="1.4"/>
</svg>
