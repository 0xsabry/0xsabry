<svg xmlns="http://www.w3.org/2000/svg" width="900" height="556"
     viewBox="0 0 900 556" role="img"
     aria-label="Mohamed Sabry Hamdan - SOC Analyst and DFIR Specialist">
  <title>Mohamed Sabry Hamdan - SOC Analyst and DFIR Specialist</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a10"/>
      <stop offset="0.55" stop-color="#07070b"/>
      <stop offset="1" stop-color="#040406"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="-0.12" r="0.95">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.22"/>
      <stop offset="0.42" stop-color="#ff9f1a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="1.15" r="0.85">
      <stop offset="0" stop-color="#ff3b30" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#fff1dc"/>
      <stop offset="0.58" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#a35f00"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#5c3a10"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a2708"/>
      <stop offset="1" stop-color="#2b0d0d"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffb347" opacity="0.045"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="card"><rect x="3" y="3" width="894" height="550" rx="16"/></clipPath>
    <g id="laurel-leaf"><ellipse rx="4.4" ry="9" fill="#ffb347" fill-opacity="0.92"/></g>
    <g id="laurel">
      <path d="M3 14 C 13 6 17 -6 14 -22" fill="none" stroke="#ffb347" stroke-width="1.6" stroke-opacity="0.85" stroke-linecap="round"/>
      <use href="#laurel-leaf" transform="translate(6 9) rotate(-52)"/>
      <use href="#laurel-leaf" transform="translate(11 2) rotate(-64)"/>
      <use href="#laurel-leaf" transform="translate(14 -6) rotate(-76)"/>
      <use href="#laurel-leaf" transform="translate(15 -14) rotate(-88)"/>
      <use href="#laurel-leaf" transform="translate(14 -21) rotate(-100)"/>
    </g>
    <g id="corner">
      <path d="M0 26 L0 0 L26 0" fill="none" stroke="#ffb347" stroke-width="2" stroke-opacity="0.55"/>
    </g>
  </defs>

  <style>
    text { font-family: ui-monospace,'SF Mono','JetBrains Mono','Fira Code','DejaVu Sans Mono',Menlo,Consolas,monospace; white-space: pre; }
    .display { font-family: Impact,Haettenschweiler,'Arial Narrow Bold','Franklin Gothic Bold',Arial,sans-serif; letter-spacing: 3px; }
    .cond    { font-family: Impact,Haettenschweiler,'Arial Narrow',Arial,sans-serif; }
    .hud   { font-size: 10px;   fill: #8b7355; letter-spacing: 1.6px; }
    .kick  { font-size: 13px;   fill: #ff9f1a; letter-spacing: 8.5px; }
    .title { font-size: 67px;   fill: url(#ink); }
    .role  { font-size: 14.5px; fill: #e8ecf1; letter-spacing: 3.2px; }
    .tag   { font-size: 17px;   fill: #9aa4b2; font-style: italic;
             font-family: Georgia,'Times New Roman',serif; }
    .chip  { font-size: 13.5px; fill: #ffb347; letter-spacing: 1.4px; }
    .chip2 { font-size: 8.5px;  fill: #8b949e; letter-spacing: 1.9px; }
    .bill  { font-size: 11.5px; fill: #6e7681; letter-spacing: 0.4px; }
    .foot  { font-size: 9.5px;  fill: #8b7355; letter-spacing: 4.5px; }
    .rec   { fill: #ff3b30; }
    .tc    { fill: #c9a227; }

    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes sweep { from { transform: translateX(-320px); } to { transform: translateX(1020px); } }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }

    @media (prefers-reduced-motion: no-preference) {
      .blink  { animation: blink 1.15s steps(1) infinite; }
      .sweep  { animation: sweep 9s linear infinite; }
      .pulse  { animation: pulse 2.4s ease-in-out infinite; }
    }
    @media (prefers-reduced-motion: reduce) { .sweep { display: none; } }
  </style>

  <rect width="900" height="556" rx="18" fill="url(#bg)"/>

  <g clip-path="url(#card)">
    <rect x="3" y="3" width="894" height="550" fill="url(#spot)"/>
    <rect x="3" y="3" width="894" height="550" fill="url(#ember)"/>
    <rect x="3" y="3" width="894" height="550" fill="url(#scanlines)"/>
    <rect x="3" y="3" width="894" height="550" filter="url(#grain)" opacity="0.05"/>
    <rect x="3" y="3" width="894" height="550" fill="url(#vig)"/>

    <g transform="translate(14 52)"><use href="#corner"/></g>
    <g transform="translate(886 52) rotate(90)"><use href="#corner"/></g>
    <g transform="translate(886 504) rotate(180)"><use href="#corner"/></g>
    <g transform="translate(14 504) rotate(270)"><use href="#corner"/></g>

    <rect class="sweep" x="-320" y="38" width="240" height="470" fill="url(#beam)"
          opacity="0.10" style="mix-blend-mode:screen"/>

    <text class="kick" x="456" y="150" text-anchor="middle">A SECURITY OPERATIONS PROFILE</text>

    <text class="display title" x="450" y="238" text-anchor="middle"
          textLength="796" lengthAdjust="spacingAndGlyphs">MOHAMED SABRY HAMDAN</text>

    <rect x="105" y="258" width="690" height="1.6" fill="url(#rule)"/>
    <g transform="translate(450 258.8)" fill="none" stroke="#ffb347" stroke-width="1.4">
      <rect x="-5.2" y="-5.2" width="10.4" height="10.4" rx="1.8" transform="rotate(45)" stroke-opacity="0.9"/>
      <circle r="2" fill="#ffb347" stroke="none"/>
    </g>

    <text class="role" x="451.6" y="300" text-anchor="middle">SOC ANALYST // DFIR SPECIALIST // DETECTION ENGINEER</text>

    <text class="tag" x="450" y="344" text-anchor="middle">The breach always leaves a trace. He reads it.</text>

    <g>
      <rect x="60" y="386" width="240" height="52" rx="4" fill="url(#holo)" fill-opacity="0.6"
            stroke="#ffb347" stroke-opacity="0.32"/>
      <rect x="60" y="386" width="240" height="52" rx="4" fill="none" stroke="#ff3b30" stroke-opacity="0.14"/>
      <text class="chip"  x="180" y="410" text-anchor="middle">115+ DETECTION RULES</text>
      <text class="chip2" x="180" y="427" text-anchor="middle">THREATSCOPEX ENGINE</text>

      <rect x="330" y="386" width="240" height="52" rx="4" fill="url(#holo)" fill-opacity="0.6"
            stroke="#ffb347" stroke-opacity="0.32"/>
      <rect x="330" y="386" width="240" height="52" rx="4" fill="none" stroke="#ff3b30" stroke-opacity="0.14"/>
      <text class="chip"  x="450" y="410" text-anchor="middle">97 MITRE TECHNIQUES</text>
      <text class="chip2" x="450" y="427" text-anchor="middle">MAPPED &amp; COVERED</text>

      <rect x="600" y="386" width="240" height="52" rx="4" fill="url(#holo)" fill-opacity="0.6"
            stroke="#ffb347" stroke-opacity="0.32"/>
      <rect x="600" y="386" width="240" height="52" rx="4" fill="none" stroke="#ff3b30" stroke-opacity="0.14"/>
      <text class="chip"  x="720" y="410" text-anchor="middle">10+ CERTIFICATIONS</text>
      <text class="chip2" x="720" y="427" text-anchor="middle">SOC / DFIR TRACKS</text>
    </g>

    <line x1="40" y1="466" x2="860" y2="466" stroke="#2a2118" stroke-width="1"/>

    <text class="cond bill" x="450" y="492" text-anchor="middle"
          textLength="820" lengthAdjust="spacingAndGlyphs">THREAT HUNTING &#183; SIEM OPERATIONS &#183; DIGITAL FORENSICS &#183; INCIDENT RESPONSE &#183; DETECTION ENGINEERING &#183; SECURITY AUTOMATION</text>

    <text class="foot" x="450" y="522" text-anchor="middle">SOC OPERATIONS / DFIR / THREAT HUNTING / SECURITY ENGINEERING</text>
  </g>

  <rect x="3" y="3" width="894" height="35" rx="16" fill="#000000" fill-opacity="0.72"/>
  <rect x="3" y="22" width="894" height="16" fill="#000000" fill-opacity="0.72"/>
  <line x1="3" y1="38" x2="897" y2="38" stroke="#ffb347" stroke-opacity="0.28"/>

  <circle class="rec blink" cx="26" cy="20.5" r="4.6" fill="#ff3b30"/>
  <text class="hud" x="38" y="24">REC  4K &#183; 24 FPS</text>

  <text class="hud" x="450" y="24" text-anchor="middle" fill="#c9a227">0xsabry // SOC-OPS DOSSIER // EYES ONLY</text>

  <text class="hud tc" x="874" y="24" text-anchor="end">TC 00:42:07:19</text>

  <rect x="3" y="3" width="894" height="550" rx="16" fill="none" stroke="url(#edge)" stroke-width="2" opacity="0.9"/>
</svg>
