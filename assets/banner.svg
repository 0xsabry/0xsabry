<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400"
     viewBox="0 0 1200 400" role="img" aria-labelledby="nw-title nw-desc">
  <title id="nw-title">NIGHTWATCH — Mohamed Sabry</title>
  <desc id="nw-desc">Decorative cyber-intelligence banner. Mohamed Sabry — cybersecurity, detection engineering and DFIR — beside a signal schematic graphic. The schematic is decorative, not live telemetry.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080e"/>
      <stop offset="0.55" stop-color="#070c14"/>
      <stop offset="1" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="-0.15" r="0.85">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#0e7490" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#9db2c6"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" fill="none" stroke="#1b2f40" stroke-width="0.7" opacity="0.5"/>
    </pattern>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="398" rx="14"/></clipPath>

    <g id="minor-tick"><line x1="985" y1="72" x2="985" y2="78" stroke="#1f3a4d" stroke-width="1"/></g>
    <g id="major-tick"><line x1="985" y1="72" x2="985" y2="82" stroke="#2a4a60" stroke-width="1.2"/></g>
    <g id="crop"><path d="M0 16 L0 0 L16 0" fill="none" stroke="#2b4659" stroke-width="1.4"/></g>
  </defs>

  <style>
    text { font-family: ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; white-space: pre; }
    .sans { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .eyebrow { font-size: 11px; fill: #22d3ee; letter-spacing: 4.2px; }
    .name    { font-size: 62px; font-weight: 300; letter-spacing: 7px; fill: url(#ink); }
    .handle  { font-size: 11.5px; fill: #5f93a8; letter-spacing: 2.6px; }
    .ident   { font-size: 13px; fill: #9fb3c8; letter-spacing: 3.2px; }
    .mission { font-size: 15.5px; fill: #b9c9d9; letter-spacing: 0.2px; }
    .meta-k  { font-size: 9px; fill: #4f677d; letter-spacing: 2.6px; }
    .meta-v  { font-size: 12px; fill: #d7e3ee; letter-spacing: 1.2px; }
    .bar     { font-size: 9px; fill: #4f677d; letter-spacing: 2.8px; }
    .dial    { font-size: 8.5px; fill: #4c657a; letter-spacing: 3px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    .sweep  { transform-box: view-box; transform-origin: 985px 196px; }
    @media (prefers-reduced-motion: no-preference) {
      .sweep   { animation: spin 14s linear infinite; }
      .contact { animation: breathe 4.2s ease-in-out infinite; }
    }
  </style>

  <rect width="1200" height="400" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>
    <rect width="1200" height="400" fill="url(#vig)"/>
    <rect width="1200" height="400" filter="url(#noise)" opacity="0.035"/>

    <g transform="translate(16 16)"><use href="#crop"/></g>
    <g transform="translate(1184 16) rotate(90)"><use href="#crop"/></g>
    <g transform="translate(1184 384) rotate(180)"><use href="#crop"/></g>
    <g transform="translate(16 384) rotate(270)"><use href="#crop"/></g>

    <circle cx="76.5" cy="70" r="3.2" fill="#34d399"/>
    <text class="eyebrow" x="90" y="74">NIGHTWATCH // CYBER INTELLIGENCE</text>
    <rect x="72" y="88" width="690" height="1" fill="url(#hair)"/>

    <text class="sans name" x="70" y="178">MOHAMED SABRY</text>

    <text class="handle" x="72" y="206">0XSABRY</text>
    <text class="handle" x="150" y="206" fill="#33566b">//</text>
    <text class="handle" x="176" y="206" fill="#547387">BLUE TEAM · SECURITY ENGINEERING</text>

    <text class="ident" x="72" y="244">CYBERSECURITY · DETECTION ENGINEERING · DFIR</text>

    <text class="sans mission" x="72" y="284">I build detection systems that turn raw telemetry into evidence —</text>
    <text class="sans mission" x="72" y="308">and evidence into decisions.</text>

    <g>
      <text class="meta-k" x="72" y="344">FOCUS</text>
      <text class="meta-v" x="72" y="362">BLUE TEAM / SOC</text>
      <line x1="250" y1="336" x2="250" y2="366" stroke="#1b2c3b"/>
      <text class="meta-k" x="272" y="344">STACK</text>
      <text class="meta-v" x="272" y="362">PYTHON · WAZUH · SIGMA</text>
      <line x1="540" y1="336" x2="540" y2="366" stroke="#1b2c3b"/>
      <text class="meta-k" x="562" y="344">BASE</text>
      <text class="meta-v" x="562" y="362">CAIRO, EG</text>
    </g>

    <g>
      <text class="dial" x="1100" y="66" text-anchor="end">SIGNAL / 01</text>

      <circle cx="985" cy="196" r="118" fill="none" stroke="#1e3446" stroke-width="1"/>
      <circle cx="985" cy="196" r="86" fill="none" stroke="#1a2c3c" stroke-width="1"/>
      <circle cx="985" cy="196" r="54" fill="none" stroke="#16283a" stroke-width="1"/>
      <line x1="867" y1="196" x2="1103" y2="196" stroke="#16283a" stroke-width="1"/>
      <line x1="985" y1="78" x2="985" y2="314" stroke="#16283a" stroke-width="1"/>

      <use href="#major-tick" transform="rotate(30 985 196)"/>
      <use href="#major-tick" transform="rotate(60 985 196)"/>
      <use href="#major-tick" transform="rotate(90 985 196)"/>
      <use href="#major-tick" transform="rotate(120 985 196)"/>
      <use href="#major-tick" transform="rotate(150 985 196)"/>
      <use href="#major-tick" transform="rotate(180 985 196)"/>
      <use href="#major-tick" transform="rotate(210 985 196)"/>
      <use href="#major-tick" transform="rotate(240 985 196)"/>
      <use href="#major-tick" transform="rotate(270 985 196)"/>
      <use href="#major-tick" transform="rotate(300 985 196)"/>
      <use href="#major-tick" transform="rotate(330 985 196)"/>

      <use href="#minor-tick" transform="rotate(15 985 196)"/>
      <use href="#minor-tick" transform="rotate(45 985 196)"/>
      <use href="#minor-tick" transform="rotate(75 985 196)"/>
      <use href="#minor-tick" transform="rotate(105 985 196)"/>
      <use href="#minor-tick" transform="rotate(135 985 196)"/>
      <use href="#minor-tick" transform="rotate(165 985 196)"/>
      <use href="#minor-tick" transform="rotate(195 985 196)"/>
      <use href="#minor-tick" transform="rotate(225 985 196)"/>
      <use href="#minor-tick" transform="rotate(255 985 196)"/>
      <use href="#minor-tick" transform="rotate(285 985 196)"/>
      <use href="#minor-tick" transform="rotate(315 985 196)"/>
      <use href="#minor-tick" transform="rotate(345 985 196)"/>

      <path class="sweep" d="M985 196 L867 196 A118 118 0 0 1 1075.4 120.2 Z" fill="url(#sweep)"/>

      <circle cx="985" cy="196" r="3" fill="#22d3ee" fill-opacity="0.7"/>
      <circle cx="985" cy="196" r="9" fill="none" stroke="#22d3ee" stroke-opacity="0.18"/>

      <g class="contact">
        <circle cx="920" cy="152" r="7" fill="none" stroke="#34d399" stroke-opacity="0.35"/>
        <circle cx="920" cy="152" r="2.8" fill="#34d399"/>
      </g>
      <circle cx="1044" cy="238" r="2.2" fill="#22d3ee" fill-opacity="0.85"/>
      <circle cx="1008" cy="118" r="1.8" fill="#22d3ee" fill-opacity="0.6"/>
      <circle cx="932" cy="252" r="1.6" fill="#22d3ee" fill-opacity="0.45"/>

      <path d="M872 342 H1098" stroke="#16283a" stroke-width="1"/>
      <polyline points="872,342 884,342 890,336 896,348 904,338 912,342 928,342 936,334 942,350 950,340 958,342 976,342 984,337 990,347 998,342 1016,342 1024,335 1030,349 1038,342 1056,342 1064,338 1070,346 1078,342 1098,342"
                fill="none" stroke="#2f586e" stroke-width="1.2" stroke-linejoin="round"/>
      <polyline points="976,342 984,337 990,347 998,342" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round" opacity="0.9"/>

      <text class="dial" x="985" y="366" text-anchor="middle">TELEMETRY SCHEMATIC</text>
    </g>

    <line x1="1" y1="374" x2="1199" y2="374" stroke="#16283a"/>
    <text class="bar" x="72" y="390">SOC · DFIR · DETECTION ENGINEERING · THREAT HUNTING</text>
    <text class="bar" x="1128" y="390" text-anchor="end" fill="#42627a">0XSABRY.GITHUB.IO</text>
  </g>

  <rect x="1" y="1" width="1198" height="398" rx="14" fill="none" stroke="#1a2b3a" stroke-width="1.4"/>
</svg>
